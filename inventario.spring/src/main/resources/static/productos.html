<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Productos</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/estilos.css">

    <!-- Librerías para Exportar a Excel y PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-box-seam"></i> Inventario</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Navegación">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item" id="menuRegistrar"><a class="nav-link" href="registrar.html">Registrar</a></li>
                    <li class="nav-item"><a class="nav-link active" href="productos.html">Productos</a></li>
                </ul>
                
                <!-- Contenedor para mostrar usuario logueado y salir -->
                <div class="d-flex align-items-center text-white" id="infoUsuarioNav">
                    <!-- Se llena automáticamente con app.js -->
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-5 flex-grow-1">
        <!-- BARRA DE BÚSQUEDA -->
        <div class="row mb-3">
            <div class="col-md-4">
                <input type="text" id="inputBuscar" class="form-control" placeholder="🔍 Buscar por código (ej. P001)..." onkeyup="filtrarProductos()">
            </div>
        </div>

        <div class="card shadow-lg border-0 rounded-3">
            <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                <h2 class="mb-0 text-primary h4"><i class="bi bi-list-ul"></i> Lista de productos</h2>
                
                <!-- Botones de Exportar y Nuevo Producto -->
                <div>
                    <button onclick="exportarExcel()" class="btn btn-sm btn-success me-1" title="Exportar a Excel">
                        <i class="bi bi-file-earmark-excel"></i> Excel
                    </button>
                    <button onclick="exportarPDF()" class="btn btn-sm btn-danger me-2" title="Exportar a PDF">
                        <i class="bi bi-file-earmark-pdf"></i> PDF
                    </button>
                    <a href="registrar.html" class="btn btn-sm btn-primary" id="btnNuevoProducto"><i class="bi bi-plus-circle"></i> Nuevo Producto</a>
                </div>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th class="ps-3">Código</th>
                                <th>Producto</th>
                                <th>Categoría</th>
                                <th>Proveedor</th>
                                <th>Precio</th>
                                <th>Cantidad</th>
                                <th>Estado</th>
                                <th>Valor Total</th>
                                <th class="text-center pe-3">Acciones</th> 
                            </tr>
                        </thead>
                        <tbody id="tablaProductos">
                            
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-4 mt-auto">
        <div class="container">
            <p class="mb-0">Sistema de Inventario - Análisis y Desarrollo de Software - 2026</p>
        </div>
    </footer>

    <!-- CONEXIÓN DE SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
