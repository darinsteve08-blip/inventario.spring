<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Producto</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Navbar Bootstrap actualizado para soportar roles y diseño responsivo -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-box-seam"></i> Inventario</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Navegación">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <!-- CAMBIO 1: Agregamos id="menuRegistrar" para ocultarlo automáticamente al operario -->
                    <li class="nav-item" id="menuRegistrar"><a class="nav-link active" href="registrar.html">Registrar</a></li>
                    <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
                </ul>
                
                <!-- CAMBIO 2: Contenedor dinámico para el usuario logueado y botón salir -->
                <div class="d-flex align-items-center text-white" id="infoUsuarioNav">
                    <!-- Se llena automáticamente con app.js -->
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-5 flex-grow-1 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h2 class="mb-4 text-center text-primary">Registrar producto</h2>
                        
                        <!-- Mensaje de Alerta -->
                        <div class="alert alert-info">
                            <div id="mensaje"></div>
                        </div>

                        <form id="formProducto">
                            <div class="mb-3">
                                <label for="codigo" class="form-label">Código:</label>
                                <input type="text" class="form-control" id="codigo" name="codigo" placeholder="Ejemplo: P001" required>
                            </div>
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre del producto:</label>
                                <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ejemplo: Teclado" required>
                            </div>
                            <div class="mb-3">
                                <label for="categoria" class="form-label">Categoría:</label>
                                <select class="form-select" id="categoria" name="categoria" required>
                                    <option value="">Seleccione una categoría</option>
                                    <option>Tecnología</option>
                                    <option>Papelería</option>
                                    <option>Accesorios</option>
                                    <option>Otros</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="proveedor" class="form-label">Proveedor:</label>
                                <input type="text" class="form-control" id="proveedor" name="proveedor" placeholder="Ejemplo: Tecno SAS" required>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="precio" class="form-label">Precio:</label>
                                    <input type="number" class="form-control" id="precio" name="precio" placeholder="120000" min="0" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="cantidad" class="form-label">Cantidad:</label>
                                    <input type="number" class="form-control" id="cantidad" name="cantidad" placeholder="10" min="0" required>
                                </div>
                            </div>
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                                <button type="reset" class="btn btn-secondary">Limpiar</button>
                                <button type="submit" class="btn btn-primary">Guardar producto</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-4 mt-auto">
        <div class="container">
            <p class="mb-0">Sistema de Inventario - Análisis y Desarrollo de Software - 2026</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
